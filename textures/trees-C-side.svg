<title>C. Soft minimal, side view</title>
<desc>Flat-shaded orthographic projection of the three.js part list (scene units, light from the top left).</desc>
<defs><style>
.b0{fill:color-mix(in srgb,var(--body,#0A84FF) 78%,#fff);stroke:color-mix(in srgb,var(--body,#0A84FF) 78%,#fff)}.b1{fill:var(--body,#0A84FF);stroke:var(--body,#0A84FF)}
