<g data-part="rail"><polygon points="25.4,-270.3 21.1,-270.3 22.6,-273.7 26.9,-273.7" fill="#656567" stroke="#656567"/><polygon points="97.4,-98.3 25.4,-270.3 26.9,-273.7 98.9,-101.7" fill="#242425" stroke="#242425"/><polygon points="97.4,-98.3 93.1,-98.3 21.1,-270.3 25.4,-270.3" fill="#242425" stroke="#242425"/></g>
