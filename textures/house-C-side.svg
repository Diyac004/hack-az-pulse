<g data-part="container"><polygon class="b1" points="-220,-8 -20,-8 -20,-184 -220,-184" fill="#0A84FF" stroke="#0A84FF"/><polygon points="-204,-18.6 -36,-18.6 -36,-173.4 -204,-173.4" fill="#3A3A3C" stroke="none"/><polygon points="-122,-18.6 -118,-18.6 -118,-173.4 -122,-173.4" fill="#000" stroke="none" opacity="0.4"/></g>
<g data-part="roof"><polygon points="-20,-248 168,-224 168,-234 -20,-258" fill="#4A4D52" stroke="#4A4D52"/></g>
<g data-part="office"><polygon points="-208,-184 -32,-184 -32,-352 -208,-352" fill="#C7C7CC" stroke="#C7C7CC"/></g>
<g data-part="post"><polygon points="152,-8 168,-8 168,-224 152,-224" fill="#3A3A3C" stroke="#3A3A3C"/></g></g>
</svg>
