<g data-part="pump"><polygon points="32,-8 80,-8 80,-144 32,-144" fill="#E5E5EA" stroke="#E5E5EA"/></g>
<g data-part="saddle"><polygon points="-168,-8 -32,-8 -32,-40 -168,-40" fill="#3A3A3C" stroke="#3A3A3C"/></g>
