<svg xmlns="http://www.w3.org/2000/svg" viewBox="-657.3 -721.9 1308.9 1102" width="1308.9" height="1102" role="img">
<title>Current depot shed, iso view</title>
<desc>Flat-shaded orthographic projection of the three.js part list. Recolour by setting the CSS custom property --body on the svg element.</desc>
<defs><style>
.b0{fill:color-mix(in srgb,var(--body,#0A84FF) 78%,#fff);stroke:color-mix(in srgb,var(--body,#0A84FF) 78%,#fff)}.b1{fill:var(--body,#0A84FF);stroke:var(--body,#0A84FF)}
.b2{fill:color-mix(in srgb,var(--body,#0A84FF) 80%,#000);stroke:color-mix(in srgb,var(--body,#0A84FF) 80%,#000)}.b3{fill:color-mix(in srgb,var(--body,#0A84FF) 62%,#000);stroke:color-mix(in srgb,var(--body,#0A84FF) 62%,#000)}
.ring{fill:var(--body,#0A84FF)}
</style>
<filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
<filter id="tight" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
<filter id="puff" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6"/></filter></defs>
<g id="ground"><polygon points="-354.6,64.5 39.4,-187.6 76.4,-200 435.1,-59.9 34.7,196.4 -39.4,187.6" fill="#000" opacity=".2" filter="url(#soft)"/></g>
<g id="tractor" stroke-width=".8" stroke-linejoin="round">
<g data-part="walls"><polygon points="-39.4,187.6 354.6,-64.5 354.6,-341.6 -39.4,-89.5" fill="#908D87" stroke="#908D87"/><polygon points="-354.6,64.5 -39.4,187.6 -39.4,-89.5 -354.6,-212.6" fill="#BAB6AE" stroke="#BAB6AE"/><polygon points="-39.4,-89.5 354.6,-341.6 39.4,-464.8 -354.6,-212.6" fill="#EEEAE2" stroke="#EEEAE2"/></g>
<g data-part="roof"><polygon points="-20.9,-78.9 379.6,-335.2 0,-450.3 0,-450.3" fill="#C2463A" stroke="#C2463A"/><polygon points="20.9,-475.3 -379.6,-219.1 0,-450.3 0,-450.3" fill="#CF6F65" stroke="#CF6F65"/><polygon points="-379.6,-219.1 -20.9,-78.9 0,-450.3 0,-450.3" fill="#CF6F65" stroke="#CF6F65"/><polygon points="379.6,-335.2 20.9,-475.3 0,-450.3 0,-450.3" fill="#C2463A" stroke="#C2463A"/></g></g>
</svg>
