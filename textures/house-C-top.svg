<svg xmlns="http://www.w3.org/2000/svg" viewBox="-644 -336 1328 648" width="1328" height="648" role="img">
<title>C. Container yard, top view</title>
<desc>Flat-shaded orthographic projection of the three.js part list. Recolour by setting the CSS custom property --body on the svg element.</desc>
<defs><style>
.b0{fill:color-mix(in srgb,var(--body,#0A84FF) 78%,#fff);stroke:color-mix(in srgb,var(--body,#0A84FF) 78%,#fff)}.b1{fill:var(--body,#0A84FF);stroke:var(--body,#0A84FF)}
.b2{fill:color-mix(in srgb,var(--body,#0A84FF) 80%,#000);stroke:color-mix(in srgb,var(--body,#0A84FF) 80%,#000)}.b3{fill:color-mix(in srgb,var(--body,#0A84FF) 62%,#000);stroke:color-mix(in srgb,var(--body,#0A84FF) 62%,#000)}
.ring{fill:var(--body,#0A84FF)}
</style>
<filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
<filter id="tight" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
<filter id="puff" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6"/></filter></defs>
<g id="ground"><polygon points="-560,-288 600,-288 601.3,-286.7 601.3,265.3 538.6,266.6 -21.4,266.6 -558.7,265.3 -560,264" fill="#000" opacity=".2" filter="url(#soft)"/></g>
<g id="tractor" stroke-width=".8" stroke-linejoin="round">
<g data-part="pad"><polygon points="600,-288 -560,-288 -560,264 600,264" fill="#DFDCD5" stroke="#DFDCD5"/></g>
<g data-part="saddle"><polygon points="-264,32 -296,32 -296,168 -264,168" fill="#656567" stroke="#656567"/></g>
<g data-part="saddle"><polygon points="-464,32 -496,32 -496,168 -464,168" fill="#656567" stroke="#656567"/></g>
<g data-part="pump"><polygon points="-344,-80 -416,-80 -416,-32 -344,-32" fill="#EBEBEF" stroke="#EBEBEF"/></g>
<g data-part="container"><polygon class="b0" points="520,20 -120,20 -120,220 520,220" fill="#409FFF" stroke="#409FFF"/></g>
<g data-part="stairs"><polygon points="-78.4,-27.1 -105.8,30.8 -113.6,27.1 -86.2,-30.8" fill="#4F4F52" stroke="#4F4F52"/><polygon points="-86.2,-30.8 -113.6,27.1 -265.6,-44.9 -238.2,-102.8" fill="#858588" stroke="#858588"/></g>
<g data-part="tank"><polygon points="-230,100 -230,60 -530,60 -530,100" fill="#EBEBEF" stroke="#EBEBEF"/><polygon points="-230,60 -230,30.7 -530,30.7 -530,60" fill="#EBEBEF" stroke="#EBEBEF"/><polygon points="-230,30.7 -230,20 -530,20 -530,30.7" fill="#E5E5EA" stroke="#E5E5EA"/><polygon points="-230,180 -230,169.3 -530,169.3 -530,180" fill="#8E8E91" stroke="#8E8E91"/><polygon points="-230,169.3 -230,140 -530,140 -530,169.3" fill="#B7B7BB" stroke="#B7B7BB"/><polygon points="-230,140 -230,100 -530,100 -530,140" fill="#E5E5EA" stroke="#E5E5EA"/></g>
<g data-part="post"><polygon points="528,-168 512,-168 512,-152 528,-152" fill="#656567" stroke="#656567"/></g>
<g data-part="post"><polygon points="-112,-168 -128,-168 -128,-152 -112,-152" fill="#656567" stroke="#656567"/></g>
<g data-part="landing"><polygon points="-80,-16 -168,-16 -168,32 -80,32" fill="#858588" stroke="#858588"/></g>
<g data-part="rail"><polygon points="-93.4,-25.4 -95.5,-21.1 -98.6,-22.6 -96.5,-26.9" fill="#2E2E30" stroke="#2E2E30"/><polygon points="-96.5,-26.9 -98.6,-22.6 -250.6,-94.6 -248.5,-98.9" fill="#656567" stroke="#656567"/></g>
<g data-part="roof"><polygon points="536,-168 -136,-168 -136,20 536,20" fill="#727478" stroke="#727478"/></g>
<g data-part="office"><polygon points="480,32 -80,32 -80,208 480,208" fill="#D3D3D7" stroke="#D3D3D7"/></g></g>
</svg>
