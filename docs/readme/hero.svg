<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Harvest Fleet AI</title>
<desc id="dsc">AI that runs a citrus farm's fleet of autonomous tractors: plans, re-plans in milliseconds, explains every decision. An autonomous tractor drives along an orchard row, painting its coverage.</desc>
<defs>
<style>
.t{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif}
.drive{animation:drive 16s linear infinite}
@keyframes drive{from{transform:translateX(-870px)}to{transform:translateX(650px)}}
.paint{transform-box:view-box;transform-origin:0 0;animation:paint 16s linear infinite}
@keyframes paint{0%,7.2%{transform:scaleX(0);opacity:1}88%{opacity:1}100%{transform:scaleX(1.8553);opacity:0}}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 2.2s ease-out infinite}
@keyframes ring{from{transform:scale(.35);opacity:.9}to{transform:scale(1.35);opacity:0}}
.beacon{animation:blink 1.1s steps(2,end) infinite}
@keyframes blink{50%{opacity:.25}}
.wheel{transform-box:fill-box;transform-origin:center;animation:spin 1.6s linear infinite}
.wheel2{transform-box:fill-box;transform-origin:center;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.plan{animation:flow 1.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-28}}
.chip{animation:chip 8.0s ease-in-out infinite}
@keyframes chip{0%,12%{opacity:0;transform:translateY(6px)}20%,70%{opacity:1;transform:translateY(0)}80%,100%{opacity:0;transform:translateY(-4px)}}
.glow{animation:glow 6s ease-in-out infinite alternate}
@keyframes glow{to{opacity:.55}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#070D1F"/><stop offset=".55" stop-color="#0E1F44"/><stop offset="1" stop-color="#16345F"/></linearGradient>
